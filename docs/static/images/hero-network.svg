<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="320" viewBox="0 0 1440 320" fill="none">
  <!-- Connections -->
  <g stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5">
    <line x1="120" y1="80" x2="280" y2="190" />
    <line x1="280" y1="190" x2="450" y2="100" />
    <line x1="450" y1="100" x2="620" y2="210" />
    <line x1="620" y1="210" x2="820" y2="120" />
    <line x1="820" y1="120" x2="980" y2="230" />
    <line x1="980" y1="230" x2="1160" y2="110" />
    <line x1="1160" y1="110" x2="1320" y2="200" />

    <line x1="120" y1="80" x2="200" y2="260" />
    <line x1="200" y1="260" x2="280" y2="190" />
    <line x1="450" y1="100" x2="520" y2="40" />
    <line x1="520" y1="40" x2="820" y2="120" />
    <line x1="620" y1="210" x2="720" y2="270" />
    <line x1="720" y1="270" x2="980" y2="230" />
    <line x1="820" y1="120" x2="1160" y2="110" />
    <line x1="980" y1="230" x2="1050" y2="280" />
    <line x1="1050" y1="280" x2="1320" y2="200" />
  </g>

  <!-- Constellation Nodes / Halos -->
  <g fill="none">
    <!-- Node 1 -->
    <circle cx="120" cy="80" r="18" fill="rgba(255, 255, 255, 0.03)" />
    <circle cx="120" cy="80" r="5" fill="rgba(255, 255, 255, 0.25)" stroke="rgba(255, 255, 255, 0.5)" stroke-width="2" />

    <!-- Node 2 -->
    <circle cx="280" cy="190" r="22" fill="rgba(255, 255, 255, 0.03)" />
    <circle cx="280" cy="190" r="6" fill="rgba(255, 255, 255, 0.3)" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2" />

    <!-- Node 3 -->
    <circle cx="450" cy="100" r="26" fill="rgba(255, 255, 255, 0.04)" />
    <circle cx="450" cy="100" r="7" fill="rgba(255, 255, 255, 0.35)" stroke="rgba(255, 255, 255, 0.7)" stroke-width="2" />

    <!-- Node 4 -->
    <circle cx="620" cy="210" r="20" fill="rgba(255, 255, 255, 0.03)" />
    <circle cx="620" cy="210" r="5" fill="rgba(255, 255, 255, 0.25)" stroke="rgba(255, 255, 255, 0.5)" stroke-width="2" />

    <!-- Node 5 -->
    <circle cx="820" cy="120" r="28" fill="rgba(255, 255, 255, 0.04)" />
    <circle cx="820" cy="120" r="8" fill="rgba(255, 255, 255, 0.4)" stroke="rgba(255, 255, 255, 0.8)" stroke-width="2" />

    <!-- Node 6 -->
    <circle cx="980" cy="230" r="24" fill="rgba(255, 255, 255, 0.03)" />
    <circle cx="980" cy="230" r="6" fill="rgba(255, 255, 255, 0.3)" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2" />

    <!-- Node 7 -->
    <circle cx="1160" cy="110" r="22" fill="rgba(255, 255, 255, 0.03)" />
    <circle cx="1160" cy="110" r="6" fill="rgba(255, 255, 255, 0.3)" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2" />

    <!-- Node 8 -->
    <circle cx="1320" cy="200" r="18" fill="rgba(255, 255, 255, 0.03)" />
    <circle cx="1320" cy="200" r="5" fill="rgba(255, 255, 255, 0.25)" stroke="rgba(255, 255, 255, 0.5)" stroke-width="2" />

    <!-- Secondary Small Nodes -->
    <circle cx="200" cy="260" r="4" fill="rgba(255, 255, 255, 0.2)" />
    <circle cx="520" cy="40" r="4" fill="rgba(255, 255, 255, 0.2)" />
    <circle cx="720" cy="270" r="4" fill="rgba(255, 255, 255, 0.2)" />
    <circle cx="1050" cy="280" r="4" fill="rgba(255, 255, 255, 0.2)" />
