baseURL = "https://chornthorn.github.io/injectify-dart/"
title = "Injectify"
enableGitInfo = true

defaultContentLanguage = "en"
locale = "en"

# Docsy theme module configuration
[module]
  [[module.imports]]
    path = "github.com/google/docsy/theme"
    disable = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.renderhooks]
      [markup.goldmark.renderhooks.link]
        useembedded = 'fallback'
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    style = "github-dark"
    tabWidth = 2

[params]
author = "Thorn Chorn"
copyright = "Thorn Chorn"
github_repo = "https://github.com/chornthorn/injectify-dart"
github_project_repo = "https://github.com/chornthorn/injectify-dart"
offlineSearch = true
time_format_default = "January 2, 2006 at 3:04 PM MST"
time_format_blog = "January 2, 2006"

# UI configuration for documentation sidebar and navigation
[params.ui]
sidebar_resizable = false
sidebar_menu_compact = false
sidebar_menu_foldable = true
sidebar_search_disable = false
sidebar_cache_limit = 1
ul_show = 3
breadcrumb_disable = false
navbar_logo = true
footer_about_enable = true
showLightDarkModeMenu = true
showlightdarkmodemenu = true

[params.ui.feedback]
enable = true
yes = 'Glad that helped! Please <a href="https://github.com/chornthorn/injectify-dart/issues/new">tell us how we can improve</a>.'
no = 'Sorry to hear that. Please <a href="https://github.com/chornthorn/injectify-dart/issues/new">tell us how we can improve</a>.'

[params.links]
[[params.links.developer]]
  name = "GitHub"
  url = "https://github.com/chornthorn/injectify-dart"
  icon = "fab fa-github"
  desc = "Source code and issue tracking"

[[params.links.developer]]
  name = "injectify (pub.dev)"
  url = "https://pub.dev/packages/injectify"
  icon = "fas fa-cubes"
  desc = "Injectify on the Dart package registry"

[[params.links.community]]
  name = "get_it (pub.dev)"
  url = "https://pub.dev/packages/get_it"
  icon = "fas fa-cube"
  desc = "Special thanks to Thomas Burkhart for GetIt"

[[params.links.community]]
  name = "injectable (pub.dev)"
  url = "https://pub.dev/packages/injectable"
  icon = "fas fa-cubes"
  desc = "Special thanks to Milad Akarie — Injectify is inspired by the original injectable package"

[menu]
  [[menu.main]]
    name = "Documentation"
    weight = 10
    url = "/docs/"
  [[menu.main]]
    name = "Blog"
    weight = 20
    url = "/blog/"
  [[menu.main]]
    name = "GitHub"
    weight = 50
    url = "https://github.com/chornthorn/injectify-dart"
