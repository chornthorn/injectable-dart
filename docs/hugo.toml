baseURL = "/"
title = "Injectable"

defaultContentLanguage = "en"
locale = "en"

# Docsy theme module configuration
[module]
  [[module.imports]]
    path = "github.com/google/docsy/theme"
    disable = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"

[params]
author = "Thorn Chorn"
copyright = "Thorn Chorn"
github_repo = "https://github.com/chornthorn/injectable-dart"
github_project_repo = "https://github.com/chornthorn/injectable-dart"
offlineSearch = true

# UI configuration for documentation sidebar and navigation
[params.ui]
sidebar_resizable = false
sidebar_menu_compact = false
sidebar_menu_foldable = true
sidebar_search_disable = false
sidebar_cache_limit = 1
ul_show = 3
breadcrumb_disable = false
navbar_logo = true
footer_about_enable = true
showLightDarkModeMenu = true
showlightdarkmodemenu = true

[params.links]
[[params.links.developer]]
  name = "GitHub"
  url = "https://github.com/chornthorn/injectable-dart"
  icon = "fab fa-github"
  desc = "Source code and issue tracking"

[[params.links.community]]
  name = "get_it (pub.dev)"
  url = "https://pub.dev/packages/get_it"
  icon = "fas fa-cube"
  desc = "Special thanks to Thomas Burkhart for GetIt"

[[params.links.community]]
  name = "injectable (pub.dev)"
  url = "https://pub.dev/packages/injectable"
  icon = "fas fa-cubes"
  desc = "Special thanks to Milad Akarie for original Injectable"

[menu]
  [[menu.main]]
    name = "Documentation"
    weight = 10
    url = "/docs/"
  [[menu.main]]
    name = "GitHub"
    weight = 50
    url = "https://github.com/chornthorn/injectable-dart"
