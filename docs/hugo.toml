baseURL = "/"
title = "Injectable"

defaultContentLanguage = "en"
locale = "en"

# Docsy theme module configuration
[module]
  [[module.imports]]
    path = "github.com/google/docsy/theme"
    disable = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"

[params]
copyright = "Injectable Authors"
github_repo = "https://github.com/chornthorn/injectable-dart"
github_project_repo = "https://github.com/chornthorn/injectable-dart"

# UI configuration matching Docsy / k8s docs style
[params.ui]
sidebar_menu_compact = false
sidebar_menu_foldable = true
sidebar_search_disable = false
breadcrumb_disable = false
navbar_logo = true
footer_about_enable = true

[params.links]
[[params.links.developer]]
  name = "GitHub"
  url = "https://github.com/chornthorn/injectable-dart"
  icon = "fab fa-github"
  desc = "Source code and issue tracking"

[menu]
  [[menu.main]]
    name = "Documentation"
    weight = 10
    url = "/docs/"
  [[menu.main]]
    name = "GitHub"
    weight = 50
    url = "https://github.com/chornthorn/injectable-dart"
