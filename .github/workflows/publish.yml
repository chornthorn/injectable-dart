name: Publish to pub.dev

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      # demo_monorepo is a standalone repo with its own nested workspace;
      # resolve it too so `dart analyze .` covers it from the repo root.
      - run: dart pub get
        working-directory: examples/demo_monorepo
      - run: dart analyze .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart test
        working-directory: packages/injectify
      - run: dart test
        working-directory: packages/injectify_generator

  publish-injectify:
    needs: [analyze, test]
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/injectify

  publish-injectify-generator:
    needs: [publish-injectify]
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/injectify_generator