name: demo_monorepo
description: >-
  Workspace root demonstrating the injectify package supporting:
  (A) a monorepo where each package has its own pubspec.yaml, and
  (A') folder-scoped micro-packages with no pubspec.yaml, nested inside a package.
  The runnable entry point is apps/root_app.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0

workspace:
  - apps/root_app
  - packages/shared
  - packages/feature_catalog

dependency_overrides:
  # `injectify_generator` declares `injectify` as an unversioned hosted
  # dependency (workspace-member style). When consumed outside the
  # workspace, pin it to the local path (or the git source).
  injectify:
    # Reference (pub.dev):
    #   injectify: ^0.1.0
    path: ../../packages/injectify
  injectify_generator:
    # Reference (pub.dev):
    #   injectify_generator: ^0.1.0
    path: ../../packages/injectify_generator
