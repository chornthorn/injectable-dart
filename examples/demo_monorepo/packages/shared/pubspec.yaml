name: shared
description: >-
  Scenario A package: standalone package with its own pubspec.yaml,
  exposing base services (AppConfig, GreetingService) to the rest of the monorepo.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  get_it: ^9.2.1
  injectify:
    # Reference (git):
    #   git:
    #     url: https://github.com/chornthorn/injectify-dart.git
    #     path: packages/injectify
    path: ../../../../packages/injectify

dev_dependencies:
  build_runner: ^2.4.0
  injectify_generator:
    # Reference (git):
    #   git:
    #     url: https://github.com/chornthorn/injectify-dart.git
    #     path: packages/injectify_generator
    path: ../../../../packages/injectify_generator
  lints: ^6.0.0
  test: ^1.25.6