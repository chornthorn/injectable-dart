name: feature_catalog
description: >-
  Scenario A package: standalone package with its own pubspec.yaml,
  depending on `shared` and receiving its services via constructor injection.
  Hosts a nested folder micro-package (features/reviews) auto-composed via
  useMicroPackage: true.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  get_it: ^9.2.1
  injectify:
    # Reference (pub.dev):
    #   injectify: ^0.1.0
    path: ../../../../packages/injectify
  shared: ^1.0.0

dev_dependencies:
  build_runner: ^2.4.0
  injectify_generator:
    # Reference (pub.dev):
    #   injectify_generator: ^0.1.0
    path: ../../../../packages/injectify_generator
  lints: ^6.0.0
  test: ^1.25.6