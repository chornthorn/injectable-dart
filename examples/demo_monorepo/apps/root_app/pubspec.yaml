name: root_app
description: >-
  The runnable app of demo_monorepo. Generates its own injection.config.dart
  via @InjectableInit and composes every package of the monorepo
  (scenario A packages and nested folder micro-packages) in configureDependencies().
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  feature_catalog: ^1.0.0
  get_it: ^9.2.1
  injectify:
    # Reference (pub.dev):
    #   injectify: ^0.1.0
    path: ../../../../packages/injectify
  shared: ^1.0.0

dev_dependencies:
  build_runner: ^2.4.0
  injectify_generator:
    # Reference (pub.dev):
    #   injectify_generator: ^0.1.0
    path: ../../../../packages/injectify_generator
  lints: ^6.0.0
  test: ^1.25.6